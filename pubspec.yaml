name: persona_site
description: Lucas Goldner - Persona(l) portfolio site, built with Jaspr.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  http: ^1.2.0
  jaspr: ^0.23.4
  jaspr_router: ^0.9.0
  universal_web: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.0
  # Pinned below 4.8.6: from that version on it requires analyzer >=13.3.0,
  # while jaspr_builder 0.23.x still depends on analyzer ^12.1.0.
  build_web_compilers: ">=4.4.6 <4.8.6"
  jaspr_builder: ^0.23.4
  lints: ^5.0.0

jaspr:
  mode: static
